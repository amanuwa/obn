<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global & Regional Trends Monitor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .active-tab {
            border-bottom: 2px solid #38bdf8;
            color: #38bdf8;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header / Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-cyan-500/10 rounded-lg border border-cyan-500/30 text-cyan-400">
                    <i class="fa-solid me-1 fa-chart-line text-xl"></i>
                </div>
                <div>
                    <h1 class="font-mono font-bold text-lg text-slate-100">TREND_MONITOR v2.1</h1>
                    <p class="text-xs text-slate-400">Targeted Regional Search Analytics</p>
                </div>
            </div>

            <!-- Region & Filter Controls -->
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <select id="regionSelect" onchange="filterTrends()" class="bg-slate-900 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-cyan-500 cursor-pointer">
                    <option value="ALL">🌐 All Focus Regions</option>
                    <option value="ETH">🇪🇹 Ethiopia</option>
                    <option value="US">🇺🇸 United States</option>
                    <option value="MIDDLE_EAST">🌍 Middle East</option>
                    <option value="ARAB">🌙 Arab Region</option>
                </select>

                <select id="categorySelect" onchange="filterTrends()" class="bg-slate-900 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-cyan-500 cursor-pointer">
                    <option value="ALL">🏷️ All Categories</option>
                    <option value="Sports">⚽ Sports</option>
                    <option value="Governmental">🏛️ Governmental / Policy</option>
                </select>

                <div class="relative flex-1 md:w-64">
                    <input type="text" id="searchInput" onkeyup="filterTrends()" placeholder="Search trends..." class="w-full bg-slate-900 border border-slate-700 text-xs text-slate-200 rounded-lg pl-8 pr-3 py-2 focus:outline-none focus:border-cyan-500">
                    <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-500 text-xs"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

        <!-- Platform Tabs -->
        <div class="flex border-b border-slate-800 text-sm font-mono space-x-6 overflow-x-auto">
            <button onclick="switchPlatform('ALL')" id="tab-ALL" class="pb-3 px-1 active-tab transition-colors flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-layer-group"></i> All Platforms
            </button>
            <button onclick="switchPlatform('Google')" id="tab-Google" class="pb-3 px-1 text-slate-400 hover:text-slate-200 transition-colors flex items-center gap-2 cursor-pointer">
                <i class="fa-brands fa-google text-red-400"></i> Google Trends
            </button>
            <button onclick="switchPlatform('TikTok')" id="tab-TikTok" class="pb-3 px-1 text-slate-400 hover:text-slate-200 transition-colors flex items-center gap-2 cursor-pointer">
                <i class="fa-brands fa-tiktok text-cyan-400"></i> TikTok Trends
            </button>
            <button onclick="switchPlatform('ChatGPT')" id="tab-ChatGPT" class="pb-3 px-1 text-slate-400 hover:text-slate-200 transition-colors flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-robot text-emerald-400"></i> ChatGPT Prompts
            </button>
        </div>

        <!-- Tabular Data Container -->
        <div class="bg-slate-900/60 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/40">
                <span class="text-xs font-mono text-slate-400 uppercase tracking-widest">// ANALYTICS PARAMETERS & TREND MATRIX</span>
                <span id="resultCount" class="text-xs font-mono text-cyan-400">Loading parameters...</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse font-mono">
                    <thead>
                        <tr class="border-b border-slate-800 text-[10px] text-slate-400 uppercase tracking-wider bg-slate-950/80">
                            <th class="p-3.5">Platform</th>
                            <th class="p-3.5">Region</th>
                            <th class="p-3.5">Category</th>
                            <th class="p-3.5">Trend Keyword / Subject</th>
                            <th class="p-3.5">Summary Detail</th>
                            <th class="p-3.5">Volume / Intent</th>
                            <th class="p-3.5">Momentum</th>
                        </tr>
                    </thead>
                    <tbody id="trendsTableBody" class="text-xs divide-y divide-slate-800/60 text-slate-300">
                        <!-- Dynamic rows injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-900 py-4 text-center text-xs text-slate-500 font-mono mt-auto">
        // Targeted Regional Analytics Stream • Google, TikTok & OpenAI Search Data
    </footer>

    <!-- Script to Handle Data and Tabular Rendering -->
    <script>
        const trendData = [
            {
                id: 1,
                keyword: "Ethiopian Premier League Scores & Fixtures",
                platform: "Google",
                category: "Sports",
                region: "ETH",
                volume: "250K+ Searches",
                growth: "+140%",
                summary: "High search volume for Saint George SA, Ethiopian Coffee FC, and national league standings."
            },
            {
                id: 2,
                keyword: "Ethiopian Customs & Foreign Exchange Policy Updates",
                platform: "Google",
                category: "Governmental",
                region: "ETH",
                volume: "180K+ Searches",
                growth: "+310%",
                summary: "Spike in public queries surrounding monetary updates, banking reforms, and commercial tariffs."
            },
            {
                id: 3,
                keyword: "NFL & NBA Playoffs Live Broadcasts",
                platform: "Google",
                category: "Sports",
                region: "US",
                volume: "15M+ Searches",
                growth: "+380%",
                summary: "Massive US search surges covering professional basketball and football league schedules."
            },
            {
                id: 4,
                keyword: "US Federal Reserve Interest Rate Decisions",
                platform: "ChatGPT",
                category: "Governmental",
                region: "US",
                volume: "High Intent Prompts",
                growth: "+210%",
                summary: "Financial analysts and users prompting AI for economic forecasts and monetary policies."
            },
            {
                id: 5,
                keyword: "Saudi Pro League Match Highlights & Transfers",
                platform: "TikTok",
                category: "Sports",
                region: "MIDDLE_EAST",
                volume: "6.4M Views",
                growth: "+290%",
                summary: "Viral short-form clips tracking star players and club rivalries across the Middle East."
            },
            {
                id: 6,
                keyword: "Middle East Regional Infrastructure & Energy Pacts",
                platform: "Google",
                category: "Governmental",
                region: "MIDDLE_EAST",
                volume: "3.2M Searches",
                growth: "+175%",
                summary: "Search interest covering cross-border economic collaborations and energy regulations."
            },
            {
                id: 7,
                keyword: "AFC Asian Cup & Regional Football Tournaments",
                platform: "Google",
                category: "Sports",
                region: "ARAB",
                volume: "4.8M Searches",
                growth: "+310%",
                summary: "Pan-Arab search interest focusing on international football qualifiers and regional matches."
            },
            {
                id: 8,
                keyword: "Arab League Economic & Digital Transformation Policies",
                platform: "ChatGPT",
                category: "Governmental",
                region: "ARAB",
                volume: "High Intent Prompts",
                growth: "+190%",
                summary: "Queries analyzing legislative changes, digital governance, and regional trade agreements."
            }
        ];

        let currentPlatform = 'ALL';

        function renderTrends(items) {
            const tableBody = document.getElementById('trendsTableBody');
            const resultCount = document.getElementById('resultCount');
            tableBody.innerHTML = '';
            resultCount.innerText = `Showing ${items.length} Parameters`;

            if (items.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="py-12 text-center text-slate-500 font-mono">
                            // No matching trends found for the selected criteria.
                        </td>
                    </tr>
                `;
                return;
            }

            items.forEach(item => {
                const isSports = item.category === 'Sports';

                const platformBadge = item.platform === 'Google' 
                    ? '<span class="text-red-400 flex items-center gap-1.5 font-bold"><i class="fa-brands fa-google"></i> Google</span>'
                    : item.platform === 'TikTok' 
                    ? '<span class="text-cyan-400 flex items-center gap-1.5 font-bold"><i class="fa-brands fa-tiktok"></i> TikTok</span>'
                    : '<span class="text-emerald-400 flex items-center gap-1.5 font-bold"><i class="fa-solid fa-robot"></i> ChatGPT</span>';

                const rowHtml = `
                    <tr class="hover:bg-slate-900/60 transition-colors">
                        <td class="p-3.5 whitespace-nowrap">${platformBadge}</td>
                        <td class="p-3.5 whitespace-nowrap">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-800 text-slate-300 border border-slate-700">
                                ${item.region}
                            </span>
                        </td>
                        <td class="p-3.5 whitespace-nowrap font-semibold ${isSports ? 'text-cyan-400' : 'text-amber-300'}">
                            ${isSports ? '⚽ Sports' : '🏛️ Govt'}
                        </td>
                        <td class="p-3.5 font-bold text-slate-100 max-w-xs">
                            ${item.keyword}
                        </td>
                        <td class="p-3.5 text-slate-400 text-[11px] max-w-md leading-relaxed">
                            ${item.summary}
                        </td>
                        <td class="p-3.5 whitespace-nowrap text-slate-300">
                            ${item.volume}
                        </td>
                        <td class="p-3.5 whitespace-nowrap text-emerald-400 font-bold">
                            <i class="fa-solid fa-arrow-trend-up mr-1 text-[10px]"></i> ${item.growth}
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += rowHtml;
            });
        }

        function filterTrends() {
            const regionVal = document.getElementById('regionSelect').value;
            const categoryVal = document.getElementById('categorySelect').value;
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = trendData.filter(item => {
                const matchesPlatform = (currentPlatform === 'ALL' || item.platform === currentPlatform);
                const matchesRegion = (regionVal === 'ALL' || item.region === regionVal);
                const matchesCategory = (categoryVal === 'ALL' || item.category === categoryVal);
                const matchesSearch = item.keyword.toLowerCase().includes(searchVal) || item.summary.toLowerCase().includes(searchVal);

                return matchesPlatform && matchesRegion && matchesCategory && matchesSearch;
            });

            renderTrends(filtered);
        }

        function switchPlatform(platform) {
            currentPlatform = platform;
            
            // Highlight active tab
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                btn.classList.remove('active-tab');
                btn.classList.add('text-slate-400');
            });
            const activeBtn = document.getElementById(`tab-${platform}`);
            if(activeBtn) {
                activeBtn.classList.add('active-tab');
                activeBtn.classList.remove('text-slate-400');
            }

            filterTrends();
        }

        // Initial Render
        document.addEventListener('DOMContentLoaded', () => {
            renderTrends(trendData);
        });
    </script>
</body>
</html>
