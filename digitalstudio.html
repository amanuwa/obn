<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Digital Studio Template</title>
    <style>
        :root {
            --bg-dark: #07090e;
            --panel-bg: rgba(15, 23, 42, 0.75);
            --accent-blue: #38bdf8;
            --accent-gold: #f59e0b;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Left Control Panel */
        .control-panel {
            width: 380px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(56, 189, 248, 0.2);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .control-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group select, .control-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
        }

        .generate-btn {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .generate-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        /* Right Studio Stage Preview (The Template Canvas) */
        .studio-stage-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #07090e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Studio Stage Aspect Ratio Box (16:9 Broadcast Format) */
        .studio-canvas {
            width: 1280px;
            height: 720px;
            position: relative;
            background: url('studio-bg-template.jpg') no-repeat center center / cover;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Modular Layers */
        .layer-screen {
            position: absolute;
            top: 80px;
            left: 80px;
            width: 680px;
            height: 440px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid var(--accent-blue);
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
            background-size: cover;
        }

        .layer-anchor {
            position: absolute;
            bottom: 0;
            right: 50px;
            height: 600px;
            z-index: 3;
            /* Transparent PNG cutout allowing clothing/avatar swaps */
            content: url('anchor-avatar-template.png'); 
        }

        .layer-desk {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 250px;
            background: url('studio-desk-glass.png') no-repeat bottom right / contain;
            z-index: 4;
            pointer-events: none;
        }

        .broadcast-ticker {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(3, 7, 18, 0.9);
            border-top: 2px solid var(--accent-gold);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 5;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Left Control Panel -->
    <div class="control-panel">
        <h2>Control Studio</h2>
        
        <div class="control-group">
            <label>Select Studio Setup</label>
            <select id="setupSelector" onchange="changeSetup()">
                <option value="setup1">Setup 1: Close-Up Portrait</option>
                <option value="setup2">Setup 2: Seated Male Anchor Desk</option>
                <option value="setup3">Setup 3: Seated Female Anchor Desk</option>
                <option value="setup4">Setup 4: Standing Presentation</option>
            </select>
        </div>

        <div class="control-group">
            <label>Select Anchor & Wardrobe</label>
            <select id="anchorSelector">
                <option value="dawit-suit">Dawit Kebede (Navy Blue Suit)</option>
                <option value="hanna-blazer">Hanna Mamo (Royal Blue Blazer)</option>
                <option value="custom-wardrobe">Custom Upload Clothing Layer</option>
            </select>
        </div>

        <div class="control-group">
            <label>Voice & Language</label>
            <select id="langSelector">
                <option value="am">Amharic (አማርኛ)</option>
                <option value="en">English</option>
                <option value="om">Afaan Oromoo</option>
                <option value="ti">Tigrinya (ትግርኛ)</option>
            </select>
        </div>

        <div class="control-group">
            <label>News Script Text</label>
            <textarea id="scriptInput" rows="4" placeholder="Type or paste breaking news script here..."></textarea>
        </div>

        <button class="generate-btn" onclick="triggerBroadcast()">Generate & Sync Live Broadcast</button>
    </div>

    <!-- Right Studio Stage Preview -->
    <div class="studio-stage-container">
        <div class="studio-canvas" id="studioCanvas">
            <!-- Modular Screen Layer -->
            <div class="layer-screen" id="screenDisplay">
                <h2 style="color: var(--accent-blue); margin-top:0;">GLOBAL FOCUS: ADDIS ABABA SUMMIT</h2>
                <p>Regional leaders arrive for economic integration talks.</p>
            </div>

            <!-- Modular Anchor Layer (Transparent Cutout for Clothing/Avatar Swapping) -->
            <img class="layer-anchor" id="anchorImage" src="anchor-female-blazer.png" alt="Anchor Avatar">

            <!-- Modular Desk Layer -->
            <div class="layer-desk"></div>

            <!-- Live News Ticker -->
            <div class="broadcast-ticker">
                <span style="color: var(--accent-gold); font-weight: bold; margin-right: 15px;">LIVE BREAKING:</span>
                <marquee scrollamount="5">Addis Ababa hosts East African infrastructural summit — Economic cooperation agreements signed today.</marquee>
            </div>
        </div>
    </div>

    <script>
        function changeSetup() {
            const setup = document.getElementById('setupSelector').value;
            const anchorImg = document.getElementById('anchorImage');
            
            // Logic to switch template configurations dynamically
            if (setup === 'setup1') {
                anchorImg.style.height = '680px';
                anchorImg.style.right = '250px';
            } else if (setup === 'setup2' || setup === 'setup3') {
                anchorImg.style.height = '520px';
                anchorImg.style.right = '60px';
            } else if (setup === 'setup4') {
                anchorImg.style.height = '650px';
                anchorImg.style.right = '450px';
            }
        }

        function triggerBroadcast() {
            const script = document.getElementById('scriptInput').value;
            alert("AI Studio Pipeline Initialized! Syncing voice, avatar wardrobe, and live screen graphics...");
        }
    </script>
</body>
</html>
