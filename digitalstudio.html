<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Digital News Studio</title>
    <style>
        :root {
            --bg-dark: #07090e;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --accent-blue: #38bdf8;
            --accent-gold: #f59e0b;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Left Control Panel */
        .control-panel {
            width: 380px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(56, 189, 248, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 { margin: 0; font-size: 18px; color: #fff; }

        .signout-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .signout-btn:hover {
            background: rgba(239, 68, 68, 0.4);
            color: #fff;
        }

        .control-group label {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 5px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group select, .control-group textarea, .control-group input {
            width: 100%;
            padding: 10px;
            background: rgba(3, 7, 18, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 6px;
            font-size: 13px;
            box-sizing: border-box;
        }

        .generate-btn {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 12px;
        }

        .generate-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        /* Right Studio Stage Preview Area */
        .studio-stage-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #07090e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Top Frame Size Toolbar */
        .canvas-toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
            background: rgba(15, 23, 42, 0.9);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            align-items: center;
        }

        .canvas-toolbar label {
            font-size: 11px;
            color: var(--accent-blue);
            font-weight: bold;
            text-transform: uppercase;
        }

        .canvas-toolbar select {
            background: rgba(3, 7, 18, 0.8);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        /* Studio Canvas Frame */
        .studio-canvas {
            width: 1000px;
            height: 562px;
            position: relative;
            background-color: #030712;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(56, 189, 248, 0.3);
            transition: all 0.3s ease-in-out;
        }

        /* Dynamic Info Overlay inside Canvas */
        .canvas-overlay-content {
            position: absolute;
            bottom: 55px;
            left: 15px;
            background: rgba(15, 23, 42, 0.85);
            padding: 10px 15px;
            border-radius: 6px;
            border-left: 4px solid var(--accent-blue);
            backdrop-filter: blur(6px);
            max-width: 350px;
            pointer-events: none;
        }

        .canvas-overlay-content h3 {
            margin: 0 0 3px 0;
            font-size: 12px;
            color: var(--accent-blue);
        }

        .canvas-overlay-content p {
            margin: 0;
            font-size: 10px;
            color: #cbd5e1;
        }

        /* Live Breaking News Ticker */
        .broadcast-ticker {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 38px;
            background: rgba(3, 7, 18, 0.95);
            border-top: 2px solid var(--accent-gold);
            display: flex;
            align-items: center;
            padding: 0 15px;
            z-index: 5;
            box-sizing: border-box;
            pointer-events: none;
        }

        /* Metadata Summary Panel Beneath Image */
        .selected-options-bar {
            display: flex;
            gap: 15px;
            margin-top: 12px;
            background: rgba(15, 23, 42, 0.7);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            color: #94a3b8;
        }

        .selected-options-bar span {
            color: #fff;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Left Control Panel -->
    <div class="control-panel">
        <div class="panel-header">
            <h2>Digital Studio</h2>
            <button class="signout-btn" onclick="signOut()">Sign Out</button>
        </div>
        
        <div class="control-group">
            <label>Select Studio Setup</label>
            <select id="setupSelector" onchange="updateStudioPreview()">
                <option value="setup1">Setup 1: Close-Up Portrait</option>
                <option value="setup2">Setup 2: Seated Male Anchor Desk</option>
                <option value="setup3">Setup 3: Seated Female Anchor Desk</option>
                <option value="setup4">Setup 4: Standing Presentation</option>
                <option value="setup5">Setup 5: Dynamic Broadcast View</option>
            </select>
        </div>

        <div class="control-group">
            <label>Voice & Language</label>
            <select id="langSelector" onchange="updateMetadata()">
                <option value="Amharic (አማርኛ)">Amharic (አማርኛ)</option>
                <option value="English">English</option>
                <option value="Afaan Oromoo">Afaan Oromoo</option>
                <option value="Tigrinya (ትግርኛ)">Tigrinya (ትግርኛ)</option>
                <option value="Somali">Somali</option>
            </select>
        </div>

        <div class="control-group">
            <label>News Script Text</label>
            <textarea id="scriptInput" rows="3" placeholder="Type breaking news script here..."></textarea>
        </div>

        <div class="control-group">
            <label>Breaking News Ticker Text</label>
            <input type="text" id="breakingNewsInput" value="Addis Ababa hosts East African infrastructural summit — Economic cooperation agreements signed today." oninput="updateBreakingNews()" />
        </div>

        <button class="generate-btn" onclick="triggerBroadcast()">Generate & Sync Live Broadcast</button>
    </div>

    <!-- Right Studio Stage Preview Area -->
    <div class="studio-stage-container">
        
        <!-- Top Frame Size Toolbar -->
        <div class="canvas-toolbar">
            <label>Platform / Frame Size:</label>
            <select id="frameSizeSelector" onchange="changeFrameSize()">
                <option value="16:9">YouTube / Standard Broadcast (16:9)</option>
                <option value="fb-post">Facebook Post / Landscape (1.91:1)</option>
                <option value="twitter-post">Twitter / X Post (16:9)</option>
                <option value="telegram-post">Telegram Channel Media (4:3)</option>
                <option value="instagram-square">Instagram Square Post (1:1)</option>
                <option value="story-vertical">TikTok / Instagram Reels / YouTube Shorts (9:16)</option>
            </select>
        </div>

        <!-- Studio Canvas -->
        <div class="studio-canvas" id="studioCanvas" style="background-image: url('setup 1.jpg');">
            
            <!-- Dynamic Info Overlay -->
            <div class="canvas-overlay-content">
                <h3 id="displayTitle">GLOBAL FOCUS: CLOSE-UP PORTRAIT</h3>
                <p id="displaySubtitle">Live AI neural sync active for broadcast setup.</p>
            </div>

            <!-- Live News Ticker -->
            <div class="broadcast-ticker">
                <span style="color: var(--accent-gold); font-weight: bold; margin-right: 15px; font-size: 11px;">LIVE BREAKING:</span>
                <marquee id="tickerMarquee" style="font-size: 12px;" scrollamount="5">Addis Ababa hosts East African infrastructural summit — Economic cooperation agreements signed today.</marquee>
            </div>
        </div>

        <!-- Selected Options Summary Bar Beneath Image -->
        <div class="selected-options-bar">
            <div>Active Setup: <span id="summarySetup">Setup 1: Close-Up Portrait</span></div>
            <div>•</div>
            <div>Language: <span id="summaryLang">Amharic (አማርኛ)</span></div>
        </div>
    </div>

    <script>
        const studioData = {
            setup1: { file: "setup 1.jpg", title: "GLOBAL FOCUS: CLOSE-UP PORTRAIT", subtitle: "Studio setup 1 active — Close-up frame layout." },
            setup2: { file: "setup 2.jpg", title: "GLOBAL FOCUS: ADDIS ABABA SUMMIT", subtitle: "Studio setup 2 active — Seated anchor desk layout." },
            setup3: { file: "setup 3.jpg", title: "GLOBAL FOCUS: REGIONAL DESK", subtitle: "Studio setup 3 active — Cultural regional desk layout." },
            setup4: { file: "setup 4.jpg", title: "GLOBAL FOCUS: STANDING PRESENTATION", subtitle: "Studio setup 4 active — Standing presentation layout." },
            setup5: { file: "setup 5.jpg", title: "GLOBAL FOCUS: DYNAMIC BROADCAST", subtitle: "Studio setup 5 active — Alternative studio arrangement." }
        };

        function updateStudioPreview() {
            const setupKey = document.getElementById('setupSelector').value;
            const currentSetup = studioData[setupKey];

            // Update background image
            const canvas = document.getElementById('studioCanvas');
            canvas.style.backgroundImage = `url('${currentSetup.file}')`;

            // Update titles and summaries
            document.getElementById('displayTitle').innerText = currentSetup.title;
            document.getElementById('displaySubtitle').innerText = currentSetup.subtitle;
            document.getElementById('summarySetup').innerText = document.getElementById('setupSelector').options[document.getElementById('setupSelector').selectedIndex].text;
            document.getElementById('summaryLang').innerText = document.getElementById('langSelector').value;
        }

        function updateMetadata() {
            document.getElementById('summaryLang').innerText = document.getElementById('langSelector').value;
        }

        function updateBreakingNews() {
            const breakingText = document.getElementById('breakingNewsInput').value;
            document.getElementById('tickerMarquee').innerText = breakingText;
        }

        function changeFrameSize() {
            const frame = document.getElementById('frameSizeSelector').value;
            const canvas = document.getElementById('studioCanvas');
            
            if (frame === '16:9' || frame === 'twitter-post') {
                canvas.style.width = '1000px';
                canvas.style.height = '562px';
            } else if (frame === 'fb-post') {
                canvas.style.width = '1000px';
                canvas.style.height = '523px';
            } else if (frame === 'telegram-post') {
                canvas.style.width = '800px';
                canvas.style.height = '600px';
            } else if (frame === 'instagram-square') {
                canvas.style.width = '550px';
                canvas.style.height = '550px';
            } else if (frame === 'story-vertical') {
                canvas.style.width = '320px';
                canvas.style.height = '568px';
            }
        }

        function signOut() {
            // Redirects to loginpage.html
            window.location.href = 'loginpage.html';
        }

        function triggerBroadcast() {
            alert("AI Video Studio Pipeline Initialized! Exporting stream configuration for selected setup.");
        }

        window.onload = function() {
            updateStudioPreview();
        };
    </script>
</body>
</html>
