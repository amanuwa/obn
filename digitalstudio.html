<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Digital Studio Template</title>
    <style>
        :root {
            --bg-dark: #07090e;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --accent-blue: #38bdf8;
            --accent-gold: #f59e0b;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Left Control Panel */
        .control-panel {
            width: 380px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(56, 189, 248, 0.2);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
            box-sizing: border-box;
            overflow-y: auto;
        }

        h2 { margin-top: 0; font-size: 20px; color: #fff; }

        .control-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group select, .control-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(3, 7, 18, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .generate-btn {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .generate-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        /* Right Studio Stage Preview */
        .studio-stage-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #07090e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        /* 16:9 Broadcast Format Canvas */
        .studio-canvas {
            width: 1100px;
            height: 618px;
            position: relative;
            background-color: #000;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(56, 189, 248, 0.3);
            transition: background-image 0.4s ease-in-out;
        }

        /* Dynamic Info Overlay */
        .canvas-overlay-content {
            position: absolute;
            bottom: 65px;
            left: 30px;
            background: rgba(15, 23, 42, 0.8);
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-blue);
            backdrop-filter: blur(8px);
            max-width: 450px;
        }

        .canvas-overlay-content h3 {
            margin: 0 0 5px 0;
            font-size: 15px;
            color: var(--accent-blue);
        }

        .canvas-overlay-content p {
            margin: 0;
            font-size: 12px;
            color: #cbd5e1;
        }

        /* Live News Ticker */
        .broadcast-ticker {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45px;
            background: rgba(3, 7, 18, 0.95);
            border-top: 2px solid var(--accent-gold);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 5;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Left Control Panel -->
    <div class="control-panel">
        <h2>Control Studio</h2>
        
        <div class="control-group">
            <label>Select Studio Setup</label>
            <select id="setupSelector" onchange="updateStudioSetup()">
                <option value="setup1">Setup 1: Close-Up Portrait Anchor</option>
                <option value="setup2">Setup 2: Seated Male Anchor Desk</option>
                <option value="setup3">Setup 3: Seated Female Anchor Desk</option>
                <option value="setup4">Setup 4: Standing Presentation</option>
                <option value="setup5">Setup 5: Dynamic Broadcast View</option>
            </select>
        </div>

        <div class="control-group">
            <label>Select Anchor & Wardrobe</label>
            <select id="anchorSelector">
                <option value="dawit-suit">Dawit Kebede (Navy Blue Suit)</option>
                <option value="hanna-blazer">Hanna Mamo (Royal Blue Blazer)</option>
                <option value="custom-wardrobe">Custom Upload Clothing Layer</option>
            </select>
        </div>

        <div class="control-group">
            <label>Voice & Language</label>
            <select id="langSelector">
                <option value="am">Amharic (አማርኛ)</option>
                <option value="en">English</option>
                <option value="om">Afaan Oromoo</option>
                <option value="ti">Tigrinya (ትግርኛ)</option>
                <option value="so">Somali</option>
            </select>
        </div>

        <div class="control-group">
            <label>News Script Text</label>
            <textarea id="scriptInput" rows="4" placeholder="Type or paste breaking news script here..."></textarea>
        </div>

        <button class="generate-btn" onclick="triggerBroadcast()">Generate & Sync Live Broadcast</button>
    </div>

    <!-- Right Studio Stage Preview -->
    <div class="studio-stage-container">
        <!-- Defaults to setup 1 image on load -->
        <div class="studio-canvas" id="studioCanvas" style="background-image: url('setup 1.jpg');">
            
            <!-- Dynamic Info Overlay -->
            <div class="canvas-overlay-content">
                <h3 id="displayTitle">GLOBAL FOCUS: CLOSE-UP PORTRAIT</h3>
                <p id="displaySubtitle">Live AI neural sync active for broadcast anchor.</p>
            </div>

            <!-- Live News Ticker -->
            <div class="broadcast-ticker">
                <span style="color: var(--accent-gold); font-weight: bold; margin-right: 15px; font-size: 12px;">LIVE BREAKING:</span>
                <marquee style="font-size: 13px;" scrollamount="5">Addis Ababa hosts East African infrastructural summit — Economic cooperation agreements signed today.</marquee>
            </div>
        </div>
    </div>

    <script>
        // Mapped dictionary matching your exact filenames with spaces in GitHub root
        const studioData = {
            setup1: {
                image: "setup 1.jpg",
                title: "GLOBAL FOCUS: CLOSE-UP PORTRAIT",
                subtitle: "Studio setup 1 active — Close-up anchor frame with notes."
            },
            setup2: {
                image: "setup 2.jpg",
                title: "GLOBAL FOCUS: ADDIS ABABA SUMMIT",
                subtitle: "Studio setup 2 active — Seated male anchor desk with regional map screen."
            },
            setup3: {
                image: "setup 3.jpg",
                title: "GLOBAL FOCUS: REGIONAL DESK",
                subtitle: "Studio setup 3 active — Seated female anchor desk."
            },
            setup4: {
                image: "setup 4.jpg",
                title: "GLOBAL FOCUS: STANDING PRESENTATION",
                subtitle: "Studio setup 4 active — Standing presenter gesturing to global touch screen."
            },
            setup5: {
                image: "setup 5.jpg",
                title: "GLOBAL FOCUS: DYNAMIC BROADCAST",
                subtitle: "Studio setup 5 active — Alternative studio arrangement."
            }
        };

        function updateStudioSetup() {
            const selectedKey = document.getElementById('setupSelector').value;
            const canvas = document.getElementById('studioCanvas');
            const titleElem = document.getElementById('displayTitle');
            const subtitleElem = document.getElementById('displaySubtitle');

            const currentSetup = studioData[selectedKey];
            if (currentSetup) {
                // Dynamically updates canvas background image to match selected dropdown setup
                canvas.style.backgroundImage = `url('${currentSetup.image}')`;
                titleElem.innerText = currentSetup.title;
                subtitleElem.innerText = currentSetup.subtitle;
            }
        }

        function triggerBroadcast() {
            const script = document.getElementById('scriptInput').value;
            alert("AI Studio Pipeline Initialized! Syncing voice, avatar wardrobe, and live screen graphics...");
        }
    </script>
</body>
</html>
